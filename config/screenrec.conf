# ========================================
# XUBUNTU SCREEN RECORDER CONFIGURATION
# ========================================

# [1] Thư mục lưu video
SCREENREC_DIR="/var/log/screenrecordings"

# [2] VIDEO ENCODING
# Số frame mỗi giây
SCREENREC_FPS=25
# Cân bằng tốc độ mã hóa và mức nén
SCREENREC_PRESET="veryfast"
# Bitrate mục tiêu 3 Mbps
SCREENREC_BITRATE="3M"
# Giới hạn bitrate theo rate control
SCREENREC_MAXRATE="4M"
# Bộ đệm rate control
SCREENREC_BUFSIZE="8M"
# Khoảng cách keyframe tối đa theo giây
SCREENREC_GOP_SECONDS=2

# [3] Thời lượng mỗi video, 1.800 giây
SCREENREC_SEGMENT_SECONDS=1800

# [4] Giữ video trong 10 × 24 giờ
SCREENREC_RETENTION_DAYS=10

# [5] MONITORING
# Chu kỳ thu thập hiệu năng
SCREENREC_METRICS_INTERVAL_SECONDS=60
# Chu kỳ kiểm tra phiên XFCE
SCREENREC_SESSION_POLL_SECONDS=2

# [6] X11 SESSION
# Số lần thử kết nối X server
SCREENREC_X11_READY_ATTEMPTS=20
# Khoảng nghỉ giữa các lần thử
SCREENREC_X11_READY_INTERVAL_SECONDS=1